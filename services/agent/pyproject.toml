[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netobserv-agent"
version = "0.2.0"
description = "RAG knowledge base + LangChain Gemini agent for the Network Observability Platform."
requires-python = ">=3.11"
dependencies = [
    # Embeddings
    "sentence-transformers>=2.7.0",
    "numpy>=1.26.0",
    # Postgres + pgvector
    "psycopg[binary]>=3.1.18",
    "psycopg-pool>=3.2.0",
    "pgvector>=0.2.5",
    # Markdown frontmatter
    "pyyaml>=6.0.1",
    # Config + logging (mirrors other services)
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    # Phase 4.2: agent runtime
    "langchain>=0.2.10",
    "langchain-core>=0.2.20",
    "langchain-google-genai>=2.0.0",
    "google-generativeai>=0.7.0",
    # FastAPI + Kafka + HTTP + InfluxDB queries
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "aiokafka>=0.10.0",
    "httpx>=0.27.0",
    # Prometheus metrics
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

# This package distributes only its dependency closure - the actual Python
# source files live at services/agent/*.py and are imported as
# ``services.agent.<module>`` from the repo root (the Dockerfile recreates the
# same layout inside the runtime image).
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
# Make the repo root importable so tests can do
# ``from services.agent.chunking import ...`` whether pytest is invoked from
# this dir or from the repo root.
pythonpath = ["../.."]
