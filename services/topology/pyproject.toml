[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netobserv-topology"
version = "0.1.0"
description = "Live network topology graph service for the Network Observability Platform."
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.11.0",
    "aioboto3>=12.4.0",
    "botocore>=1.34.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "uvicorn>=0.29.0",
    "fastapi>=0.111.0",
    "networkx>=3.3",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
netobserv-topology = "netobserv_topology.app:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["netobserv_topology*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
