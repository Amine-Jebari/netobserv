[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netobserv-anomaly"
version = "0.2.0"
description = "Baseline trainer + real-time anomaly detection engine for the Network Observability Platform."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "pyod>=1.1.3",
    "joblib>=1.4.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "aiokafka>=0.11.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

# This package distributes only its dependency closure — the actual Python
# source files live at services/anomaly/*.py and are imported as
# ``services.anomaly.<module>`` from the repo root (the Dockerfile arranges the
# same layout inside the runtime image). ``py-modules = []`` tells setuptools
# not to auto-discover and ship loose .py files as installable modules.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
# Make the repo root importable so tests can do
# ``from services.anomaly.features import ...`` whether pytest is invoked
# from this dir or from the repo root.
pythonpath = ["../.."]
