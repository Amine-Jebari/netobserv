# ═══════════════════════════════════════════════════════════════════════════════
#  Network Observability Platform — Local Development Stack
#
#  Start the full stack:  docker compose up -d
#  Stop:                  docker compose down
#  Wipe all data:         docker compose down -v   ⚠️  deletes all volumes
#  Single service:        docker compose up -d <service-name>
#
#  All credentials are read from .env — copy .env.example → .env first.
# ═══════════════════════════════════════════════════════════════════════════════

name: netobserv

networks:
  netobserv:
    driver: bridge

volumes:
  redpanda_data:
  influxdb_data:
  influxdb_config:
  opensearch_data:
  dynamodb_data:
  minio_data:
  postgres_data:
  grafana_data:

services:

  # ── Redpanda (Kafka-compatible broker) ───────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v24.1.1
    container_name: netobserv-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 512M
      - --mode dev-container
      - --default-log-level=warn
    ports:
      - "9092:19092"   # Kafka — Docker services use redpanda:9092; host tools use localhost:9092
      - "9644:9644"    # Admin API
      - "8081:18081"   # Schema Registry
      - "8082:18082"   # HTTP Proxy / PandaProxy
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - netobserv
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # One-shot: creates all Kafka topics after the broker is healthy
  redpanda-init:
    image: redpandadata/redpanda:v24.1.1
    container_name: netobserv-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_TOPIC_FLOWS: ${KAFKA_TOPIC_FLOWS}
      KAFKA_TOPIC_BGP: ${KAFKA_TOPIC_BGP}
      KAFKA_TOPIC_SNMP: ${KAFKA_TOPIC_SNMP}
      KAFKA_TOPIC_ANOMALIES: ${KAFKA_TOPIC_ANOMALIES}
      KAFKA_TOPIC_RUNBOOKS: ${KAFKA_TOPIC_RUNBOOKS}
      KAFKA_TOPIC_TOPOLOGY_UPDATES: ${KAFKA_TOPIC_TOPOLOGY_UPDATES}
    entrypoint:
      - /bin/bash
      - -c
      - |
        rpk topic create $$KAFKA_TOPIC_FLOWS $$KAFKA_TOPIC_BGP $$KAFKA_TOPIC_SNMP $$KAFKA_TOPIC_ANOMALIES $$KAFKA_TOPIC_RUNBOOKS $$KAFKA_TOPIC_TOPOLOGY_UPDATES --brokers redpanda:9092 -p 3 -r 1 || true &&
        echo 'All Kafka topics ready.'
    networks:
      - netobserv
    restart: "no"

  # Redpanda Console — web UI for browsing topics and messages
  redpanda-console:
    image: redpandadata/console:v2.5.2
    container_name: netobserv-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "8080:8080"
    networks:
      - netobserv
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── InfluxDB 2.x ─────────────────────────────────────────────────────────────
  influxdb:
    image: influxdb:2.7
    container_name: netobserv-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - netobserv
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/health | grep -q '\"status\":\"pass\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── OpenSearch 2.x ───────────────────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: netobserv-opensearch
    environment:
      cluster.name: netobserv-cluster
      node.name: opensearch-node1
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS}
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"   # Performance Analyzer
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - netobserv
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # OpenSearch Dashboards — visualization UI for logs and events
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: netobserv-opensearch-dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    networks:
      - netobserv
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q '\"overall\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ── DynamoDB Local ────────────────────────────────────────────────────────────
  dynamodb-local:
    image: amazon/dynamodb-local:2.4.0
    container_name: netobserv-dynamodb
    # Run as root so the named volume (mounted as root:root by Docker) is writable.
    # DynamoDB Local's default user (dynamodblocal) cannot write to a fresh volume,
    # causing a silent SQLite crash-loop while the healthcheck still passes.
    user: "0"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    networks:
      - netobserv
    healthcheck:
      # DynamoDB Local responds with HTTP 400 to unauthenticated requests — that means it's up
      test: ["CMD-SHELL", "curl -sf -o /dev/null -w '%{http_code}' http://localhost:8000/ | grep -qE '^[0-9]' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── MinIO (S3-compatible object storage) ──────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: netobserv-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    networks:
      - netobserv
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot: creates MinIO buckets after MinIO is healthy
  minio-init:
    image: minio/mc:RELEASE.2024-04-18T16-45-29Z
    container_name: netobserv-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@minio:9000
    entrypoint: >
      /bin/sh -c "
        mc mb --ignore-existing local/${S3_BUCKET_ARCHIVE} &&
        mc mb --ignore-existing local/${S3_BUCKET_RUNBOOKS} &&
        echo 'MinIO buckets ready.'
      "
    networks:
      - netobserv
    restart: "no"

  # ── Postgres 16 + pgvector ────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: netobserv-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - netobserv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── Simulator (synthetic VPC flows / BGP / SNMP telemetry) ───────────────────
  simulator:
    build:
      context: ./services/simulator
      dockerfile: Dockerfile
    image: netobserv/simulator:local
    container_name: netobserv-simulator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_FLOWS: ${KAFKA_TOPIC_FLOWS}
      KAFKA_TOPIC_BGP: ${KAFKA_TOPIC_BGP}
      KAFKA_TOPIC_SNMP: ${KAFKA_TOPIC_SNMP}
      PRODUCER_RATE: ${SIMULATOR_PRODUCER_RATE:-75}
      SCENARIO_MODE: ${SIMULATOR_SCENARIO_MODE:-scheduled}
      SCENARIO: ${SIMULATOR_SCENARIO:-normal}
      ANOMALY_INTERVAL_MINUTES: ${SIMULATOR_ANOMALY_INTERVAL_MINUTES:-15}
      SNMP_INTERVAL_SECONDS: ${SIMULATOR_SNMP_INTERVAL_SECONDS:-30}
      HEALTH_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "8090:8080"   # host:container — container 8080 is reserved for Redpanda Console on the host
    networks:
      - netobserv
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Collector (Kafka → InfluxDB / OpenSearch / MinIO fan-out) ────────────────
  collector:
    build:
      context: ./services/collector
      dockerfile: Dockerfile
    image: netobserv/collector:local
    container_name: netobserv-collector
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_FLOWS: ${KAFKA_TOPIC_FLOWS}
      KAFKA_TOPIC_BGP: ${KAFKA_TOPIC_BGP}
      KAFKA_TOPIC_SNMP: ${KAFKA_TOPIC_SNMP}
      KAFKA_TOPIC_TOPOLOGY_UPDATES: ${KAFKA_TOPIC_TOPOLOGY_UPDATES}
      KAFKA_CONSUMER_GROUP_PREFIX: ${KAFKA_COLLECTOR_GROUP_PREFIX:-netobserv-collector}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-latest}
      INFLUXDB_URL: ${INFLUXDB_URL}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      # Code expects OPENSEARCH_URL; repo-wide .env uses OPENSEARCH_HOST.
      OPENSEARCH_URL: ${OPENSEARCH_HOST}
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT_URL}
      S3_BUCKET: ${S3_BUCKET_ARCHIVE}
      S3_REGION: ${S3_REGION}
      HTTP_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "8091:8080"   # host:container — container 8080; host 8091 keeps 8080/8090 free
    networks:
      - netobserv
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Topology (Kafka → DynamoDB graph + REST/WebSocket API) ───────────────────
  topology:
    build:
      context: ./services/topology
      dockerfile: Dockerfile
    image: netobserv/topology:local
    container_name: netobserv-topology
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_TOPOLOGY_UPDATES: ${KAFKA_TOPIC_TOPOLOGY_UPDATES}
      KAFKA_TOPIC_FLOWS: ${KAFKA_TOPIC_FLOWS}
      KAFKA_TOPIC_SNMP: ${KAFKA_TOPIC_SNMP}
      KAFKA_CONSUMER_GROUP_PREFIX: ${KAFKA_TOPOLOGY_GROUP_PREFIX:-netobserv-topology}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-latest}
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT_URL}
      DYNAMODB_REGION: ${DYNAMODB_REGION}
      DYNAMODB_TABLE_TOPOLOGY: ${DYNAMODB_TABLE_TOPOLOGY:-network-topology}
      DYNAMODB_TABLE_LINKS: ${DYNAMODB_TABLE_LINKS:-network-links}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      TOPOLOGY_REFRESH_INTERVAL: ${TOPOLOGY_REFRESH_INTERVAL:-300}
      TRAFFIC_EWMA_ALPHA: ${TRAFFIC_EWMA_ALPHA:-0.2}
      HTTP_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "8092:8080"   # host:container — keeps 8080/8090/8091 free for other services
    networks:
      - netobserv
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      dynamodb-local:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Baseline trainer (one-shot, profile=training) ────────────────────────────
  # Pulls the last LOOKBACK_HOURS of telemetry, trains three PyOD models, and
  # uploads the bundle to MinIO. Excluded from `docker compose up` by default —
  # invoke with: docker compose --profile training up baseline
  baseline:
    profiles: ["training"]
    build:
      context: ./services/anomaly
      dockerfile: Dockerfile
    image: netobserv/anomaly:local
    container_name: netobserv-baseline
    # Override the image's default entrypoint (the long-running engine) so this
    # service runs the trainer instead.
    entrypoint: ["python", "-m", "services.anomaly.baseline"]
    environment:
      INFLUXDB_URL: ${INFLUXDB_URL}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      OPENSEARCH_URL: ${OPENSEARCH_HOST}
      OPENSEARCH_USER: ${OPENSEARCH_USER:-}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      OPENSEARCH_BGP_INDEX_PATTERN: ${ANOMALY_BGP_INDEX_PATTERN:-bgp-events-*}
      S3_ENDPOINT: ${S3_ENDPOINT_URL}
      S3_BUCKET: ${S3_BUCKET_ARCHIVE}
      S3_REGION: ${S3_REGION}
      S3_MODEL_PREFIX: ${ANOMALY_MODEL_PREFIX:-models}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      LOOKBACK_HOURS: ${ANOMALY_LOOKBACK_HOURS:-24}
      CONTAMINATION_TRAFFIC: ${ANOMALY_CONTAMINATION_TRAFFIC:-0.05}
      CONTAMINATION_BGP: ${ANOMALY_CONTAMINATION_BGP:-0.05}
      CONTAMINATION_SNMP: ${ANOMALY_CONTAMINATION_SNMP:-0.05}
      MIN_TRAINING_MINUTES: ${ANOMALY_MIN_TRAINING_MINUTES:-30}
      RANDOM_SEED: ${ANOMALY_RANDOM_SEED:-42}
      LOG_LEVEL: ${LOG_LEVEL}
    networks:
      - netobserv
    depends_on:
      influxdb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  # ── Anomaly engine (real-time scorer, Phase 3.2) ─────────────────────────────
  # Long-lived service: consumes telemetry, scores in fixed windows, emits
  # enriched anomaly events to anomalies.scored. Blocks on startup until the
  # baseline trainer has uploaded its first model bundle to MinIO.
  anomaly-engine:
    build:
      context: ./services/anomaly
      dockerfile: Dockerfile
    image: netobserv/anomaly:local
    container_name: netobserv-anomaly-engine
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_FLOWS: ${KAFKA_TOPIC_FLOWS}
      KAFKA_TOPIC_BGP: ${KAFKA_TOPIC_BGP}
      KAFKA_TOPIC_SNMP: ${KAFKA_TOPIC_SNMP}
      KAFKA_TOPIC_ANOMALIES: ${KAFKA_TOPIC_ANOMALIES}
      KAFKA_CONSUMER_GROUP_PREFIX: ${KAFKA_ANOMALY_GROUP_PREFIX:-netobserv-anomaly}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-latest}
      S3_ENDPOINT: ${S3_ENDPOINT_URL}
      S3_BUCKET: ${S3_BUCKET_ARCHIVE}
      S3_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      MODEL_KEY: ${ANOMALY_MODEL_KEY:-models/baseline-latest.tar.gz}
      WINDOW_SECONDS: ${ANOMALY_WINDOW_SECONDS_RT:-10}
      INFO_THRESHOLD: ${ANOMALY_INFO_THRESHOLD:-0.3}
      WARN_THRESHOLD: ${ANOMALY_WARN_THRESHOLD:-0.6}
      CRITICAL_THRESHOLD: ${ANOMALY_CRITICAL_THRESHOLD:-0.85}
      TOPOLOGY_SERVICE_URL: ${TOPOLOGY_SERVICE_URL:-http://topology:8080}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      MODEL_WAIT_POLL_SECONDS: ${ANOMALY_MODEL_WAIT_POLL_SECONDS:-10}
      MODEL_WAIT_MAX_SECONDS: ${ANOMALY_MODEL_WAIT_MAX_SECONDS:-0}
      HTTP_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "8093:8080"   # host:container — keeps 8080-8092 free for other services
    networks:
      - netobserv
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      topology:
        condition: service_healthy
    healthcheck:
      # /health returns 503 until a model bundle is loaded — the engine still
      # starts the HTTP server during the wait, so this check is reliable.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ── Runbook seeder (one-shot, profile=seeding) ──────────────────────────────
  # Reads markdown runbooks from ./data/runbooks, chunks + embeds them with
  # sentence-transformers, and upserts into Postgres' runbook_chunks table.
  # Excluded from `docker compose up` by default - invoke with:
  #   docker compose --profile seeding up seed-runbooks
  seed-runbooks:
    profiles: ["seeding"]
    build:
      context: ./services/agent
      dockerfile: Dockerfile
    image: netobserv/agent:local
    container_name: netobserv-seed-runbooks
    # Override the image's default agent entrypoint to run the seeder instead.
    entrypoint: ["python", "-m", "scripts.seed_runbooks"]
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      RUNBOOKS_DIR: /data/runbooks
      CHUNK_MAX_TOKENS: ${CHUNK_MAX_TOKENS:-300}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-50}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - ./data/runbooks:/data/runbooks:ro
      - ./scripts:/app/scripts:ro
    networks:
      - netobserv
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: netobserv-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: datasourceProvisioningEnvironmentVariables
      # Passed through so grafana/provisioning/datasources/influxdb.yaml can reference them
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
    ports:
      - "3001:3000"   # host:container — leaves 3000 free for the React frontend
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - netobserv
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
